name: CD - Deploy to ECS

on:
  # run only AFTER the build workflow completes (and still allow manual runs)
  workflow_run:
    workflows: ["CI - Build Docker Image"]   # must match build.yml `name`
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# prevent overlapping deploys if multiple pushes happen quickly
concurrency:
  group: ecs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # only deploy if the build succeeded AND the original event was a push
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"

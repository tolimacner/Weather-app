services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock 

  weather-app:
    image: tolimacner/weather-app:ver3
    container_name: weather-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - jenkins

volumes:
  jenkins_home:
